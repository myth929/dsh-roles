name: Publish to npm

# Fires when pushing a version tag (v*).
# Uses npm Trusted Publishing (OIDC) — configure this exact workflow filename (`release.yml`)
# under the package's npmjs.com Settings -> Trusted Publisher after the initial publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check DeepSeek Harness plugin
        uses: bowenliang123/dsh-plugin-checker@v1

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm exec vitest run

      - name: Verify version matches the tag
        run: |
          TAG="${{ github.ref_name }}"
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package version $VER"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists, skipping."
            exit 0
          fi

          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          node -e '
            const fs = require("node:fs");
            const ver = process.argv[1];
            const out = process.argv[2];
            if (!fs.existsSync("CHANGELOG.md")) process.exit(1);
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = ver.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const match = md.match(new RegExp(`(?:^|\\r?\\n)## \\[${escaped}\\][^\\r\\n]*\\r?\\n([\\s\\S]*?)(?=\\r?\\n## \\[|$)`));
            const body = match ? match[1].trim() : "";
            if (!body) process.exit(1);
            fs.writeFileSync(out, body + "\n");
          ' "$VERSION" "$NOTES_FILE" && HAS_NOTES=1 || HAS_NOTES=0

          if [ "$HAS_NOTES" -eq 1 ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES_FILE" $PRERELEASE_FLAG
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes $PRERELEASE_FLAG
          fi
